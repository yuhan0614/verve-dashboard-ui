<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; font-size: 14px; }

  .header { background: #111; color: white; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; }

  .fetch-btn { padding: 7px 18px; background: #52c41a; color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }

  .table-header { padding: 14px 20px; border-bottom: 1px solid #f0f2f5; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .table-header h3 { font-size: 15px; font-weight: 600; }
  .table-header-right { display: flex; align-items: center; gap: 10px; }

<script>
const ACCOUNT_ID = '1417409513448597';
let trendChart, pieChart;
let perfGrain = 'day';
let _perfArgs = null;
function setPerfGrain(g) { perfGrain = g; if (_perfArgs) renderPerf.apply(null, _perfArgs); }
function toggleSub(id, el) {
  const g = document.getElementById(id);
  if (!g) return;
  const open = g.style.display !== 'none';
  g.style.display = open ? 'none' : '';
  const t = el.querySelector('.tog');
  if (t) t.textContent = open ? '▶' : '▼';
}
function dayGrainKey(d, grain) {
  if (grain === 'day')   return { k: d, label: d };
  if (grain === 'month') return { k: d.slice(0,7), label: d.slice(0,7) };
  const pad = n => String(n).padStart(2,'0');
  const t = new Date(d + 'T00:00:00');
  const mon = new Date(t); mon.setDate(t.getDate() - ((t.getDay()+6)%7));
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return { k: toYMD(mon), label: `${pad(mon.getMonth()+1)}/${pad(mon.getDate())}–${pad(sun.getMonth()+1)}/${pad(sun.getDate())}` };
}
function grainBtnsFor(fnName, cur) {
  return `<div style="display:flex;gap:4px">` + [['day','日'],['week','週'],['month','月']]
    .map(([g,l]) => `<button class="preset-btn${cur===g?' active':''}" style="padding:3px 13px;font-size:11px" onclick="${fnName}('${g}')">${l}</button>`)
    .join('') + `</div>`;
}
function bucketByGrain(rows, dateField, grain, sumFields) {
  if (grain === 'day') return rows;
  const map = {};
  for (const r of rows) {
    const { k, label } = dayGrainKey(r[dateField], grain);
    if (!map[k]) { map[k] = { ...r, [dateField]: label, _k: k }; sumFields.forEach(f => map[k][f] = 0); }
    sumFields.forEach(f => { map[k][f] += parseFloat(r[f]) || 0; });
  }
  return Object.values(map).sort((a,b) => a._k < b._k ? -1 : 1);
}

let overallSpendChart = null, overallPieChart = null;
let ovGrain = null;
let _ovArgs = null;
function setOvGrain(g) {
  ovGrain = g;
  if (_ovArgs) renderOverall.apply(null, _ovArgs);
}
function ovGrainBtns(cur) {
  return `<div style="display:flex;gap:4px">` + [['day','日'],['week','週'],['month','月']]
    .map(([g,l]) => `<button class="preset-btn${cur===g?' active':''}" style="padding:3px 13px;font-size:11px" onclick="setOvGrain('${g}')">${l}</button>`)
    .join('') + `</div>`;
}
let allAdData = [];
let allCampDaily = [];
let allAssetData = [];
let adUrlMap = {};
let adSince = '', adUntil = '';
let sortKey = '', sortDir = -1;

// in-memory cache — persists across date changes without re-fetching
let _cache = {};
async function cachedFetch(url) {
  if (!_cache[url]) _cache[url] = fetch(url).then(r => r.text());
  return _cache[url];
}

const SHOLINE_JSON = './sl_cache.json';
const META_API = 'https://verve-dashboard-api.fly.dev/api/meta';
const GADS_API = 'https://verve-dashboard-api.fly.dev/api/google-ads';

function gadsApiToRows(apiResult) {
  const apiRows = Array.isArray(apiResult) ? apiResult : (apiResult.data || []);
  const dailyMap = {};
  apiRows.forEach(r => {
    if (!dailyMap[r.date]) dailyMap[r.date] = {'日期':r.date,'花費(TWD)':0,'曝光':0,'點擊':0,'購買':0,'營收(TWD)':0};
    dailyMap[r.date]['花費(TWD)'] += r.cost;
    dailyMap[r.date]['曝光']      += r.impressions;
    dailyMap[r.date]['點擊']      += r.clicks;
    dailyMap[r.date]['購買']      += r.conversions;
    dailyMap[r.date]['營收(TWD)'] += r.conversion_value;
  });
  const daily = Object.values(dailyMap).sort((a,b) => a['日期']>b['日期']?1:-1);
  const campaign = apiRows.map(r => ({'日期':r.date,'廣告活動':r.campaign_name,'花費(TWD)':r.cost,'曝光':r.impressions,'點擊':r.clicks,'購買':r.conversions,'營收(TWD)':r.conversion_value}));
  const age    = (apiResult.age    || []).map(r => ({'年齡層':r.age,   '日期':r.date||'','廣告活動':r.campaign_name||'','花費(TWD)':r.cost,'曝光':r.impressions,'點擊':r.clicks,'購買':r.conversions,'營收(TWD)':r.conversion_value}));
  const gender = (apiResult.gender || []).map(r => ({'性別':r.gender,  '日期':r.date||'','廣告活動':r.campaign_name||'','花費(TWD)':r.cost,'曝光':r.impressions,'點擊':r.clicks,'購買':r.conversions,'營收(TWD)':r.conversion_value}));
  return { daily, campaign, age, gender, location:[], adgroup:[], keyword:[] };
}

// ── Date ──────────────────────────────────────────────────
function toYMD(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function clearPreset() {
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
}
function applyPreset(days) {
  const to = new Date();
  to.setDate(to.getDate() - 1);
  const from = new Date(to);
  from.setDate(to.getDate() - days + 1);
  document.getElementById('dateFrom').value = toYMD(from);
  document.getElementById('dateTo').value = toYMD(to);
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}
function applyPresetToday() {
  const d = new Date();
  document.getElementById('dateFrom').value = toYMD(d);
  document.getElementById('dateTo').value = toYMD(d);
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}
function applyPresetYesterday() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  document.getElementById('dateFrom').value = toYMD(d);
  document.getElementById('dateTo').value = toYMD(d);
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}
function applyPresetMonth() {
  const now = new Date();
  document.getElementById('dateFrom').value = toYMD(new Date(now.getFullYear(), now.getMonth(), 1));
  document.getElementById('dateTo').value = toYMD(now);
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}
(function() {
  const to = new Date();
  to.setDate(to.getDate() - 1);
  const from = new Date(to);
  from.setDate(to.getDate() - 6);
  document.getElementById('dateFrom').value = toYMD(from);
  document.getElementById('dateTo').value = toYMD(to);
})();

// ── Tabs ──────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

// ── Fetch ─────────────────────────────────────────────────
function mergeMetaLive(base, live) {
  if (!live || live.error) return base;
  const keyFns = {
    daily:     r => r.date_start,
    campaigns: r => `${r.date_start}|${r.campaign_id}`,
    ads:       r => `${r.date_start}|${r.ad_id}`,
    age:       r => `${r.date_start}|${r.campaign_id}|${r.age||''}`,
    gender:    r => `${r.date_start}|${r.campaign_id}|${r.gender||''}`,
  };
  const out = { ...base };
  for (const [k, kf] of Object.entries(keyFns)) {
    if (!live[k]) continue;
    const m = {};
    (base[k] || []).forEach(r => { m[kf(r)] = r; });
    live[k].forEach(r => { m[kf(r)] = r; });
    out[k] = Object.values(m);
  }
  if (live.ad_urls) out.ad_urls = { ...(base.ad_urls || {}), ...live.ad_urls };
  if (live.updated) out.updated = live.updated;
  return out;
}

async function fetchData(forceRefresh = false) {
  if (forceRefresh) _cache = {};
  const since = document.getElementById('dateFrom').value;
  const until = document.getElementById('dateTo').value;
  const btn = document.getElementById('fetchBtn');
  const status = document.getElementById('statusText');
  btn.disabled = true;
  document.getElementById('loadingOverlay').classList.add('show');
  status.textContent = '載入中…'; status.className = 'status-text';

  const prev = calcPrevDates(since, until);

  // helper: aggregate meta rows by date range + grouping keys
  function metaAgg(rows, since, until, groupKeys) {
    const map = {};
    rows.filter(r => r.date_start >= since && r.date_start <= until).forEach(r => {
      const k = groupKeys.map(f => r[f]).join('|');
      if (!map[k]) { map[k] = {...r, spend:0, impressions:0, clicks:0, link_clicks:0, purchase:0, purchase_value:0, add_to_cart:0, reach:0}; }
      const g = map[k];
      g.spend += r.spend; g.impressions += r.impressions; g.clicks += r.clicks;
      g.link_clicks += r.link_clicks; g.purchase += r.purchase;
      g.purchase_value += r.purchase_value; g.add_to_cart += r.add_to_cart; g.reach += r.reach;
    });
    return Object.values(map).map(r => {
      r.roas  = r.spend > 0 ? r.purchase_value / r.spend : 0;
      r.cpa   = r.purchase > 0 ? r.spend / r.purchase : 0;
      r.ctr   = r.impressions > 0 ? r.clicks / r.impressions * 100 : 0;
      r.cplc  = r.link_clicks > 0 ? r.spend / r.link_clicks : 0;
      return r;
    });
  }

  try {
    // 預設讀靜態快取（快、不怕 Render cold start）；forceRefresh 才打後端
    const metaUrl = './meta_cache.json';
    const safeParse = (txt, fallback) => { try { return JSON.parse(txt); } catch { return fallback; } };
    // 歷史資料靜態快取已涵蓋，按「更新資料」只即時補最近幾天
    const LIVE_DAYS = 3;
    const _lt = new Date(), _lf = new Date();
    _lf.setDate(_lt.getDate() - (LIVE_DAYS - 1));
    const liveSince = toYMD(_lf), liveUntil = toYMD(_lt);
    const metaLivePromise = (forceRefresh && until >= liveSince)
      ? fetch(`${META_API}?since=${liveSince}&until=${liveUntil}`)
          .then(r => r.ok ? r.json() : null).catch(() => null)
      : Promise.resolve(null);
    const gadsStaticUrl = `./gads_cache.json?t=${Date.now()}`;
    const gadsBgPromise = forceRefresh
      ? fetch(`${GADS_API}?since=${since}&until=${until}`).then(r => r.json()).catch(() => null)
      : null;
    const [metaResult, gadsResult, sholineTxt,
           ga4DailyTxt, ga4ChTxt, ga4SmTxt] = await Promise.all([
      (forceRefresh
        ? fetch(`${metaUrl}?t=${Date.now()}`).then(r=>r.text())
        : cachedFetch(metaUrl)
      ).catch(() => '{}'),
      fetch(gadsStaticUrl).then(r=>r.json()).catch(() => ({data:[]})),
      cachedFetch(SHOLINE_JSON).catch(() => '{}'),
      cachedFetch('./ga4_daily.json').catch(() => '[]'),
      cachedFetch('./ga4_channels.json').catch(() => '[]'),
      cachedFetch('./ga4_source_medium.json').catch(() => '[]'),
    ]);
    const metaCache = mergeMetaLive(safeParse(metaResult, {}), await metaLivePromise);
    const trendData     = metaAgg(metaCache.daily     || [], since, until, ['date_start']);
    const prevTrendData = metaAgg(metaCache.daily     || [], prev.since, prev.until, ['date_start']);
    const campData      = metaAgg(metaCache.campaigns || [], since, until, ['campaign_id','campaign_name']);
    const ageData       = metaAgg(metaCache.age       || [], since, until, ['campaign_id','campaign_name','age']);
    const genderData    = metaAgg(metaCache.gender    || [], since, until, ['campaign_id','campaign_name','gender']);
    allAdData           = metaCache.ads || [];
    allCampDaily        = metaCache.campaigns || [];
    allAssetData        = metaCache.assets || [];
    adSince = since; adUntil = until;
    adUrlMap            = metaCache.ad_urls || {};

    const gadsRows = gadsApiToRows(gadsResult);
    const gDaily   = gadsRows.daily;
    const gCamp    = gadsRows.campaign;
    const gAge     = gadsRows.age, gGender = gadsRows.gender, gLoc = [], gAg = [], gKw = [];
    const sholineJson = safeParse(sholineTxt, {});
    const ga4Cache = {
      daily:               safeParse(ga4DailyTxt, []),
      daily_channels:      safeParse(ga4ChTxt, []),
      daily_source_medium: safeParse(ga4SmTxt, []),
      daily_items:         [],
      daily_search:        [],
    };
    // lazy load items + search + SL product/discount data in background
    let slItemsCache = {}, slDiscCache = {};
    Promise.all([
      cachedFetch('./ga4_items.json').catch(() => '[]'),
      cachedFetch('./ga4_search.json').catch(() => '[]'),
      cachedFetch('./sl_items_cache.json').catch(() => '{}'),
      cachedFetch('./sl_discounts_cache.json').catch(() => '{}'),
    ]).then(([itemsTxt, searchTxt, slItemsTxt, slDiscTxt]) => {
      ga4Cache.daily_items  = safeParse(itemsTxt, []);
      ga4Cache.daily_search = safeParse(searchTxt, []);
      slItemsCache = safeParse(slItemsTxt, {});
      slDiscCache  = safeParse(slDiscTxt, {});
      renderGA4(ga4Cache, since, until, trendData, gDaily, prev, prevTrendData);
      renderSholine(sholineJson, since, until, trendData, gDaily, prev, prevTrendData, slItemsCache, slDiscCache, ga4Cache.daily_items);
    });

    renderOverall(trendData, gDaily, since, until, ageData, genderData, gAge, gGender, prevTrendData, prev, ga4Cache);
    renderGA4(ga4Cache, since, until, trendData, gDaily, prev, prevTrendData);
    renderSholine(sholineJson, since, until, trendData, gDaily, prev, prevTrendData);
    renderPerf(campData, trendData, since, until, prevTrendData);
    renderCreative();
    renderDemographic(ageData, genderData);
    function applyGads(gadsData) {
      const r = gadsApiToRows(gadsData);
      renderOverall(trendData, r.daily, since, until, ageData, genderData, r.age, r.gender, prevTrendData, prev, ga4Cache);
      renderGoogleAds({ daily: r.daily, campaign: r.campaign, age: r.age, gender: r.gender, location: [], adgroup: [], keyword: r.keyword }, since, until, prev);
    }

    applyGads(gadsResult);

    const updatedAt = metaCache.updated || new Date().toLocaleString('zh-TW');
    document.getElementById('lastUpdate').textContent = updatedAt;
    status.className = 'status-text ok';

    if (gadsBgPromise) {
      status.textContent = `✓ 完成・${campData.length} campaigns・${allAdData.length} 素材（Google Ads 更新中…）`;
      gadsBgPromise.then(liveData => {
        if (liveData && !liveData.error) {
          applyGads(liveData);
        }
        status.textContent = `✓ 完成・${campData.length} campaigns・${allAdData.length} 素材`;
      });
    } else {
      status.textContent = `✓ 完成・${campData.length} campaigns・${allAdData.length} 素材`;
    }
  } catch(e) {
    status.textContent = `❌ ${e.message}`; status.className = 'status-text err';
  } finally {
    btn.disabled = false;
    document.getElementById('loadingOverlay').classList.remove('show');
  }
}

// ── Formatters ────────────────────────────────────────────
function fmtN(n, d=0) { if (n == null || isNaN(n)) return '<span class="na">—</span>'; return (+n).toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtM(n) { if (!n && n !== 0) return '<span class="na">—</span>'; return 'NT$'+Math.round(n).toLocaleString('zh-TW'); }

function switchTopItems(mode) {
  if (!window._renderTopItems) return;
  document.getElementById('topItemsBody').innerHTML = window._renderTopItems(mode);
  ['all','male','female'].forEach(m => {
    const btn = document.getElementById('tiTab_'+m);
    if (!btn) return;
    btn.style.background = m===mode ? '#6366f1' : '#f0f0f0';
    btn.style.color      = m===mode ? '#fff'    : '#666';
  });
}
function fmtP(n) { if (n == null) return '<span class="na">—</span>'; return (+n).toFixed(2)+'%'; }
function rc(r) { return r >= 10 ? 'roas-high' : r >= 3 ? 'roas-mid' : 'roas-low'; }

function diffBadge(curr, prev, inverse = false) {
  if (!prev) return '<span style="font-size:11px;color:#ccc">—</span>';
  const pct = (curr - prev) / Math.abs(prev) * 100;
  const sign = pct > 0 ? '+' : '';
  const good = inverse ? pct <= 0 : pct >= 0;
  const color = good ? '#52c41a' : '#f5222d';
  return `<span style="font-size:11px;color:${color};font-weight:500">${sign}${pct.toFixed(1)}%</span>`;
}

function calcPrevDates(since, until) {
  const days = Math.round((new Date(until) - new Date(since)) / 86400000) + 1;
  const pu = new Date(since); pu.setDate(pu.getDate() - 1);
  const ps = new Date(pu); ps.setDate(ps.getDate() - days + 1);
  return { since: toYMD(ps), until: toYMD(pu) };
}

function groupRows(rows, keyFn, metaFn) {
  const map = {};
  for (const r of rows) {
    const key = keyFn(r);
    if (!map[key]) {
      map[key] = { ...metaFn(r), spend: 0, impressions: 0, link_clicks: 0, add_to_cart: 0, purchase: 0, purchase_value: 0 };
    }
    const g = map[key];
    g.spend         += r.spend         || 0;
    g.impressions   += r.impressions   || 0;
    g.link_clicks   += r.link_clicks   || 0;
    g.add_to_cart   += r.add_to_cart   || 0;
    g.purchase      += r.purchase      || 0;
    g.purchase_value+= r.purchase_value|| 0;
  }
  return Object.values(map).map(g => ({
    ...g,
    ctr:  g.impressions > 0 ? g.link_clicks / g.impressions * 100 : 0,
    cplc: g.link_clicks > 0 ? g.spend / g.link_clicks : 0,
    roas: g.spend > 0 ? g.purchase_value / g.spend : 0,
    cpa:  g.purchase > 0 ? g.spend / g.purchase : 0,
  }));
}

function applyAdFilter() {
  const camp = document.getElementById('campFilter')?.value || '';
  const q = (document.getElementById('adSearch')?.value || '').toLowerCase();
  const inRange = r => (!adSince || !r.date_start || (r.date_start >= adSince && r.date_start <= adUntil));
  const inCamp  = r => (!camp || r.campaign_name === camp);

  // 有活用創意素材資料的廣告，改用素材層級呈現，避免跟廣告層級重複計算
  const assetRows = allAssetData.filter(r => inRange(r) && inCamp(r) && r.asset_id);
  const assetAdIds = new Set(assetRows.map(r => r.ad_id));
  const adRows = allAdData.filter(r => inRange(r) && inCamp(r) && !assetAdIds.has(r.ad_id));

  const assets = groupRows(assetRows,
    r => `${r.asset_kind}|${r.asset_id}`,
    r => ({ ad_name: r.asset_name || r.asset_id, kind: r.asset_kind,
            thumb: r.asset_url || '', ad_names: r.ad_name || '' }));
  const ads = groupRows(adRows,
    r => r.ad_name || '—',
    r => ({ ad_name: r.ad_name || '—', kind: 'ad',
            thumb: (adUrlMap[r.ad_name]||{}).image || (adUrlMap[r.ad_name]||{}).thumb || '', ad_names: '' }));

  const all = [...assets, ...ads].filter(r => !q || (r.ad_name||'').toLowerCase().includes(q));
  renderAdTable(all);
}

function sortAds(key) {
  if (sortKey === key) sortDir *= -1;
  else { sortKey = key; sortDir = -1; }
  document.querySelectorAll('#tab-creative th.sortable').forEach(th => {
    th.classList.remove('sort-asc','sort-desc');
    if (th.getAttribute('onclick') === `sortAds('${key}')`) {
      th.classList.add(sortDir === -1 ? 'sort-desc' : 'sort-asc');
    }
  });
  applyAdFilter();
}

function renderAdTable(data) {
  const sorted = [...data].sort((a,b) => ((a[sortKey]||0)-(b[sortKey]||0)) * sortDir);
  const maxSpend = Math.max(...sorted.map(r=>r.spend||0), 1);
  document.getElementById('adCount').textContent = `${sorted.length} 筆`;
  document.getElementById('adTableBody').innerHTML = sorted.map(r => {

// ── CSV parser ────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).map(line => {
    const vals = [];
    let cur = '', inQ = false;
    for (const ch of line) {
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { vals.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    vals.push(cur.trim());
    const obj = {};
    headers.forEach((h, i) => obj[h] = (vals[i]||'').replace(/^"|"$/g,''));
    return obj;
  });
}

function filterByDate(rows, since, until) {
  return rows.filter(r => {
    const d = r['日期'] || r['date'] || '';
    return d >= since && d <= until;
  });
}

function aggRows(rows, dimKeys) {
  const map = {};
  rows.forEach(r => {
    const key = dimKeys.map(k => r[k]||'').join('||');
    if (!map[key]) {
      map[key] = { _keys: {}, spend:0, imp:0, clk:0, purchase:0, revenue:0 };
      dimKeys.forEach(k => map[key]._keys[k] = r[k]||'');
    }
    map[key].spend    += parseFloat(r['花費(TWD)'])||0;
    map[key].imp      += parseInt(r['曝光'])||0;
    map[key].clk      += parseInt(r['點擊'])||0;
    map[key].purchase += parseFloat(r['購買'])||0;
    map[key].revenue  += parseFloat(r['營收(TWD)'])||0;
  });
  return Object.values(map).sort((a,b) => b.spend - a.spend);
}

function gadsTable(rows, cols) {
  if (!rows.length) return '<div style="padding:20px;color:#aaa">無資料</div>';
  const maxSpend = Math.max(...rows.map(r=>r.spend||0), 1);

    <tbody>${rows.map(r=>{
      const bw = Math.round((r.spend||0)/maxSpend*60);

        if (c.fmt === 'R') return `<td class="${rc(r[c.key]||0)}">${(r[c.key]||0)?((+r[c.key]).toFixed(2)+'x'):'<span class="na">—</span>'}</td>`;

let overallAgePie=null,overallAgeBar=null,overallGenderPie=null,overallGenderBar=null;
function renderOverall(trendData, gDaily, since, until, metaAgeData, metaGenderData, gAge, gGender, prevTrendData, prev, ga4Cache) {
  _ovArgs = [trendData, gDaily, since, until, metaAgeData, metaGenderData, gAge, gGender, prevTrendData, prev, ga4Cache];
  const el = document.getElementById('tab-overall');

  // Meta daily totals
  const metaDays = trendData.filter(r => r.date_start >= since && r.date_start <= until);
  const meta = metaDays.reduce((a,r) => ({
    spend: a.spend+(r.spend||0), imp: a.imp+(r.impressions||0),
    clk: a.clk+(r.link_clicks||0), purchase: a.purchase+(r.purchase||0),
    revenue: a.revenue+(r.purchase_value||0),
  }), {spend:0,imp:0,clk:0,purchase:0,revenue:0});
  meta.roas = meta.spend > 0 ? meta.revenue/meta.spend : 0;
  meta.cpa  = meta.purchase > 0 ? meta.spend/meta.purchase : 0;
  meta.ctr  = meta.imp > 0 ? meta.clk/meta.imp*100 : 0;

  // Google daily totals
  const gDays = filterByDate(gDaily, since, until);
  const gads = gDays.reduce((a,r) => ({
    spend: a.spend+(parseFloat(r['花費(TWD)'])||0), imp: a.imp+(parseInt(r['曝光'])||0),
    clk: a.clk+(parseInt(r['點擊'])||0), purchase: a.purchase+(parseFloat(r['購買'])||0),
    revenue: a.revenue+(parseFloat(r['營收(TWD)'])||0),
  }), {spend:0,imp:0,clk:0,purchase:0,revenue:0});
  gads.roas = gads.spend > 0 ? gads.revenue/gads.spend : 0;
  gads.cpa  = gads.purchase > 0 ? gads.spend/gads.purchase : 0;
  gads.ctr  = gads.imp > 0 ? gads.clk/gads.imp*100 : 0;

  // Sub-row grouping
  const daysDiff = (new Date(until) - new Date(since)) / 86400000 + 1;
  const groupBy = ovGrain || (daysDiff <= 31 ? 'day' : daysDiff <= 90 ? 'week' : 'month');
  const ovLabel = groupBy === 'day' ? '每日' : groupBy === 'week' ? '每週' : '每月';
  const ovBtns  = ovGrainBtns(groupBy);
  function wkStart(s) {
    const d = new Date(s), day = d.getDay(), diff = day===0?-6:1-day;
    d.setDate(d.getDate()+diff); return toYMD(d);
  }
  function groupKey(s) { return groupBy==='day'?s:groupBy==='week'?wkStart(s):s.slice(0,7); }
  function groupLabel(k) {
    if (groupBy==='day') return k;
    if (groupBy==='week') return `W ${k}`;
    const [y,m] = k.split('-'); return `${y}/${m}`;
  }
  function buildGroups(rows, keyFn) {
    const map = {};
    rows.forEach(r => {
      const k = keyFn(r);
      if (!map[k]) map[k] = {spend:0,imp:0,clk:0,purchase:0,revenue:0};
      const g = map[k];
      g.spend+=r.s||0; g.imp+=r.i||0; g.clk+=r.c||0; g.purchase+=r.p||0; g.revenue+=r.rv||0;
    });
    return Object.entries(map).sort((a,b)=>a[0]<b[0]?-1:1).map(([k,v])=>{
      v.roas = v.spend>0?v.revenue/v.spend:0;
      v.cpa  = v.purchase>0?v.spend/v.purchase:0;
      v.ctr  = v.imp>0?v.clk/v.imp*100:0;
      v.label = groupLabel(k); return v;
    });
  }

  function buildGroupsWithKey(rows, keyFn) {
    const map = {};
    rows.forEach(r => {
      const k = keyFn(r);
      if (!map[k]) map[k] = {spend:0,imp:0,clk:0,purchase:0,revenue:0,_key:k};
      const g = map[k];
      g.spend+=r.s||0; g.imp+=r.i||0; g.clk+=r.c||0; g.purchase+=r.p||0; g.revenue+=r.rv||0;
    });
    return Object.entries(map).sort((a,b)=>a[0]<b[0]?-1:1).map(([k,v])=>{
      v.roas = v.spend>0?v.revenue/v.spend:0;
      v.cpa  = v.purchase>0?v.spend/v.purchase:0;
      v.ctr  = v.imp>0?v.clk/v.imp*100:0;
      v.label = groupLabel(k); return v;
    });
  }
  const metaSubRows = buildGroupsWithKey(
    metaDays.map(r=>({s:r.spend||0,i:r.impressions||0,c:r.link_clicks||0,p:r.purchase||0,rv:r.purchase_value||0,_k:groupKey(r.date_start)})),
    r=>r._k
  );
  const gadsSubRows = buildGroupsWithKey(
    gDays.map(r=>({s:parseFloat(r['花費(TWD)'])||0,i:parseInt(r['曝光'])||0,c:parseInt(r['點擊'])||0,p:parseFloat(r['購買'])||0,rv:parseFloat(r['營收(TWD)'])||0,_k:groupKey(r['日期'])})),
    r=>r._k
  );
  const subRowHTML = (rows, bg, ga4Map) => rows.map(v=>{
    const ga4Rev = ga4Map[v._key]||0;
    const ga4Roas = v.spend>0&&ga4Rev?ga4Rev/v.spend:0;
    return `<tr style="background:${bg};font-size:11px">
    <td style="padding-left:28px;color:#888">${v.label}</td>
    <td>${fmtM(v.spend)}</td><td>${fmtN(v.imp)}</td><td>${fmtN(v.clk)}</td>
    <td>${fmtP(v.ctr)}</td><td>${fmtN(v.purchase,0)}</td><td>${fmtM(v.revenue)}</td>
    <td class="${rc(v.roas)}">${v.roas.toFixed(2)}x</td><td>${fmtM(v.cpa)}</td>
    <td style="color:#2563eb">${ga4Rev?fmtM(ga4Rev):'—'}</td>
    <td style="color:#2563eb">${ga4Roas?ga4Roas.toFixed(2)+'x':'—'}</td>
  </tr>`;}).join('');

  // Combined
  const total = {
    spend: meta.spend + gads.spend, imp: meta.imp + gads.imp,
    clk: meta.clk + gads.clk, purchase: meta.purchase + gads.purchase,
    revenue: meta.revenue + gads.revenue,
  };
  total.roas = total.spend > 0 ? total.revenue/total.spend : 0;
  total.cpa  = total.purchase > 0 ? total.spend/total.purchase : 0;

  // Prev period
  const prevMeta = (prevTrendData||[]).reduce((a,r) => ({
    spend: a.spend+(r.spend||0), purchase: a.purchase+(r.purchase||0), revenue: a.revenue+(r.purchase_value||0),
  }), {spend:0,purchase:0,revenue:0});
  const prevGDays = filterByDate(gDaily, prev.since, prev.until);
  const prevGads = prevGDays.reduce((a,r) => ({
    spend: a.spend+(parseFloat(r['花費(TWD)'])||0), purchase: a.purchase+(parseFloat(r['購買'])||0), revenue: a.revenue+(parseFloat(r['營收(TWD)'])||0),
  }), {spend:0,purchase:0,revenue:0});
  const prevTotal = { spend: prevMeta.spend+prevGads.spend, purchase: prevMeta.purchase+prevGads.purchase, revenue: prevMeta.revenue+prevGads.revenue };
  prevTotal.roas = prevTotal.spend > 0 ? prevTotal.revenue/prevTotal.spend : 0;
  prevTotal.cpa  = prevTotal.purchase > 0 ? prevTotal.spend/prevTotal.purchase : 0;

  // GA4 廣告營收（分來源）
  const sinceD = since.replace(/-/g,''), untilD = until.replace(/-/g,'');
  const prevSinceD = prev.since.replace(/-/g,''), prevUntilD = prev.until.replace(/-/g,'');
  const META_SM  = ['facebook / cpc', 'facebook / paid'];
  const GOOGLE_SM = ['google / cpc'];
  const sm = (ga4Cache?.daily_source_medium||[]);
  const ga4MetaRev   = sm.filter(r=>r.date>=sinceD&&r.date<=untilD&&META_SM.includes((r.sessionSourceMedium||'').toLowerCase())).reduce((s,r)=>s+parseFloat(r.totalRevenue||0),0);
  const ga4GoogleRev = sm.filter(r=>r.date>=sinceD&&r.date<=untilD&&GOOGLE_SM.includes((r.sessionSourceMedium||'').toLowerCase())).reduce((s,r)=>s+parseFloat(r.totalRevenue||0),0);
  const ga4Rev  = ga4MetaRev + ga4GoogleRev;
  const ga4Roas = total.spend > 0 ? ga4Rev/total.spend : 0;
  const prevGa4MetaRev   = sm.filter(r=>r.date>=prevSinceD&&r.date<=prevUntilD&&META_SM.includes((r.sessionSourceMedium||'').toLowerCase())).reduce((s,r)=>s+parseFloat(r.totalRevenue||0),0);
  const prevGa4GoogleRev = sm.filter(r=>r.date>=prevSinceD&&r.date<=prevUntilD&&GOOGLE_SM.includes((r.sessionSourceMedium||'').toLowerCase())).reduce((s,r)=>s+parseFloat(r.totalRevenue||0),0);
  const prevGa4Rev  = prevGa4MetaRev + prevGa4GoogleRev;

  // GA4 sub-row grouping by source

  function buildGa4Groups(sources) {
    const map = {};
    sm.filter(r=>r.date>=sinceD&&r.date<=untilD&&sources.includes((r.sessionSourceMedium||'').toLowerCase()))
      .forEach(r=>{
        const k = groupKey(ga4DateToYMD(r.date));
        map[k] = (map[k]||0) + parseFloat(r.totalRevenue||0);
      });
    return map;
  }
  const metaGa4Map  = buildGa4Groups(META_SM);
  const gadsGa4Map  = buildGa4Groups(GOOGLE_SM);
  const totalGa4Map = buildGa4Groups([...META_SM, ...GOOGLE_SM]);
  const totalSubRows = buildGroupsWithKey([
    ...metaDays.map(r=>({s:r.spend||0,i:r.impressions||0,c:r.link_clicks||0,p:r.purchase||0,rv:r.purchase_value||0,_k:groupKey(r.date_start)})),
    ...gDays.map(r=>({s:parseFloat(r['花費(TWD)'])||0,i:parseInt(r['曝光'])||0,c:parseInt(r['點擊'])||0,p:parseFloat(r['購買'])||0,rv:parseFloat(r['營收(TWD)'])||0,_k:groupKey(r['日期'])})),
  ], r=>r._k);

  // Trend: align dates, compute daily total spend + ROAS
  const metaByDate = {};
  metaDays.forEach(r => { metaByDate[r.date_start] = { spend: r.spend||0, revenue: r.purchase_value||0 }; });

  const trendMap = {};

    trendMap[k].rv += (metaByDate[d]?.revenue||0) + (gByDate[d]?.revenue||0);

      metaDs.data.forEach((mv, i) => {
        const gv = gadsDs.data[i]||0;
        const total = mv + gv;
        if (!total) return;
        const meta_pct = Math.round(mv/total*100);
        const gads_pct = 100 - meta_pct;
        const xPos = x.getPixelForValue(i);
        // Meta segment center (bottom portion)
        const yMetaTop = y.getPixelForValue(mv);
        const yBase    = y.getPixelForValue(0);

        // Google segment center (top portion)
        const yTotal   = y.getPixelForValue(total);
        const gadsH    = yMetaTop - yTotal;
        if (metaH > 14) {
          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          ctx.fillText(`${meta_pct}%`, xPos, yMetaTop + metaH/2);
        }
        if (gadsH > 14) {
          ctx.fillStyle = 'rgba(255,255,255,0.9)';

  const AGE_ORDER = ['13-17','18-24','25-34','35-44','45-54','55-64','65+'];

  function combineDemo(metaRows, metaLabelKey, metaLabelMap, gadsRows, gadsLabelKey) {
    const map = {};
    metaRows.forEach(r => {
      const lbl = metaLabelMap?.[r[metaLabelKey]] || r[metaLabelKey] || '—';
      if (!map[lbl]) map[lbl] = { spend:0, purchase:0, revenue:0 };
      map[lbl].spend   += parseFloat(r.spend)||0;
      map[lbl].purchase+= parseFloat(r.purchase)||0;
      map[lbl].revenue += parseFloat(r.purchase_value)||0;
    });
    const gFiltered = aggRows(filterByDate(gadsRows, since, until), [gadsLabelKey]);
    gFiltered.forEach(r => {
      const raw = r._keys[gadsLabelKey];
      const lbl = raw === '65-UP' ? '65+' : raw;
      if (!map[lbl]) map[lbl] = { spend:0, purchase:0, revenue:0 };
      map[lbl].spend   += r.spend||0;
      map[lbl].purchase+= r.purchase||0;
      map[lbl].revenue += r.revenue||0;
    });
    return Object.entries(map).map(([lbl, v]) => ({
      label: lbl, spend: v.spend, purchase: v.purchase, revenue: v.revenue,
      roas: v.spend > 0 ? v.revenue/v.spend : 0,
      cpa:  v.purchase > 0 ? v.spend/v.purchase : 0,

let gadsTrendChart = null, gadsPieChart = null;
let gaGrain = 'day';
let _gaArgs = null;
function setGaGrain(g) { gaGrain = g; if (_gaArgs) renderGoogleAds.apply(null, _gaArgs); }

function renderGoogleAds(data, since, until, prev) {
  _gaArgs = [data, since, until, prev];
  const gaLabel = gaGrain === 'day' ? '每日' : gaGrain === 'week' ? '每週' : '每月';
  const gaBtns  = grainBtnsFor('setGaGrain', gaGrain);
  gadsData = data;
  const el = document.getElementById('tab-gads');

  const daily = filterByDate(data.daily, since, until);

  function buildAgg(rows, dimKeys) {
    return aggRows(filterByDate(rows, since, until), dimKeys).map(r => {
      const ctr  = r.imp > 0 ? r.clk/r.imp*100 : 0;
      const cpa  = r.purchase > 0 ? r.spend/r.purchase : 0;
      const roas = r.spend > 0 ? r.revenue/r.spend : 0;
      return { ...r._keys, spend:r.spend, imp:r.imp, clk:r.clk, ctr, purchase:r.purchase, revenue:r.revenue, cpa, roas };
    });
  }

  const gAgeOrder = ['18-24','25-34','35-44','45-54','55-64','65-UP','65+','Unknown'];
  const ageRows = buildAgg(data.age, ['年齡層']).sort((a,b) => {
    const ai = gAgeOrder.indexOf(a['年齡層']), bi = gAgeOrder.indexOf(b['年齡層']);
    return (ai===-1?99:ai) - (bi===-1?99:bi);
  });
  const genderRows = buildAgg(data.gender,   ['性別']);
  const locRows    = buildAgg(data.location, ['城市']);
  const campRows = aggRows(filterByDate(data.campaign || [], since, until), ['廣告活動']).map(r => {
    const ctr  = r.imp > 0 ? r.clk/r.imp*100 : 0;
    const cpa  = r.purchase > 0 ? r.spend/r.purchase : 0;
    const roas = r.spend > 0 ? r.revenue/r.spend : 0;
    return { ...r._keys, spend:r.spend, imp:r.imp, clk:r.clk, ctr, purchase:r.purchase, revenue:r.revenue, cpa, roas };
  });
  const agRows     = buildAgg(data.adgroup,  ['廣告活動','廣告群組']);
  const kwRows     = buildAgg(data.keyword,  ['廣告群組','關鍵字','比對類型']);

  const metricCols = [
    { label:'花費', key:'spend' },
    { label:'曝光', key:'imp', fmt:'N' },
    { label:'點擊', key:'clk', fmt:'N' },
    { label:'CTR', key:'ctr', fmt:'P' },
    { label:'購買', key:'purchase', fmt:'N' },
    { label:'營收', key:'revenue', fmt:'M' },
    { label:'CPA', key:'cpa', fmt:'M' },
    { label:'ROAS', key:'roas', fmt:'R' },
  ];

  // 每日 rows for trend chart
  const dailyRows = bucketByGrain(daily.map(r => {
    const spend   = parseFloat(r['花費(TWD)'])||0;
    const revenue = parseFloat(r['營收(TWD)'])||0;
    const clk     = parseInt(r['點擊'])||0;
    const imp     = parseInt(r['曝光'])||0;
    const purchase= parseFloat(r['購買'])||0;
    return {
      date: r['日期'], spend, imp, clk, purchase, revenue,
      ctr:  imp > 0 ? clk/imp*100 : 0,
      cpc:  clk > 0 ? spend/clk : 0,
      cpa:  purchase > 0 ? spend/purchase : 0,
      roas: spend > 0 ? revenue/spend : 0,
    };
  }).sort((a,b) => a.date > b.date ? 1 : -1), 'date', gaGrain, ['spend','imp','clk','purchase','revenue'])
    .map(r => ({ ...r,
      ctr:  r.imp > 0 ? r.clk/r.imp*100 : 0,
      cpc:  r.clk > 0 ? r.spend/r.clk : 0,
      cpa:  r.purchase > 0 ? r.spend/r.purchase : 0,
      roas: r.spend > 0 ? r.revenue/r.spend : 0,
    }));

  // 總計
  const total = dailyRows.reduce((a,r) => ({
    spend: a.spend+r.spend, imp: a.imp+r.imp, clk: a.clk+r.clk,
    purchase: a.purchase+r.purchase, revenue: a.revenue+r.revenue,
  }), {spend:0,imp:0,clk:0,purchase:0,revenue:0});

// ── GA4 ──────────────────────────────────────────────────────
let ga4TrendChart = null;
let ga4ChGroupChart = null;
let ga4Grain = 'day';
let _ga4Args = null;
function setGa4Grain(g) {
  ga4Grain = g;
  if (_ga4Args) renderGA4.apply(null, _ga4Args);
}
function ga4GrainKey(ymd, grain) {
  const pad = n => String(n).padStart(2,'0');
  if (grain === 'day')   return { k: ymd, label: ymd.slice(4,6)+'/'+ymd.slice(6,8) };
  if (grain === 'month') return { k: ymd.slice(0,6), label: ymd.slice(0,4)+'-'+ymd.slice(4,6) };
  const t = new Date(+ymd.slice(0,4), +ymd.slice(4,6)-1, +ymd.slice(6,8));
  const mon = new Date(t); mon.setDate(t.getDate() - ((t.getDay()+6)%7));
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return {
    k: `${mon.getFullYear()}${pad(mon.getMonth()+1)}${pad(mon.getDate())}`,
    label: `${pad(mon.getMonth()+1)}/${pad(mon.getDate())}–${pad(sun.getMonth()+1)}/${pad(sun.getDate())}`,
  };
}
function ga4BucketDaily(rows, grain) {
  if (grain === 'day') return rows;
  const map = {};
  for (const r of rows) {
    const { k, label } = ga4GrainKey(r.date, grain);
    if (!map[k]) map[k] = { date:k, _label:label, sessions:0, addToCarts:0, conversions:0, totalRevenue:0, _dur:0, _bounce:0 };
    const g = map[k], s = parseFloat(r.sessions||0);
    g.sessions += s;
    g.addToCarts   += parseFloat(r.addToCarts||0);
    g.conversions  += parseFloat(r.conversions||0);
    g.totalRevenue += parseFloat(r.totalRevenue||0);
    g._dur    += parseFloat(r.averageSessionDuration||0) * s;
    g._bounce += parseFloat(r.bounceRate||0) * s;
  }
  return Object.values(map).sort((a,b)=>a.date.localeCompare(b.date)).map(g => ({
    ...g,
    averageSessionDuration: g.sessions ? g._dur/g.sessions : 0,
    bounceRate:             g.sessions ? g._bounce/g.sessions : 0,
  }));
}
function ga4GrainBtns(grain) {
  return `<div style="display:flex;gap:4px">` + [['day','日'],['week','週'],['month','月']]
    .map(([g,l]) => `<button class="preset-btn${grain===g?' active':''}" style="padding:3px 13px;font-size:11px" onclick="setGa4Grain('${g}')">${l}</button>`)
    .join('') + `</div>`;
}
function renderGA4(cache, since, until, trendData, gDaily, prev, prevTrendData) {
  _ga4Args = [cache, since, until, trendData, gDaily, prev, prevTrendData];
  const gLabel = ga4Grain === 'day' ? '每日' : ga4Grain === 'week' ? '每週' : '每月';
  const gBtns  = ga4GrainBtns(ga4Grain);
  const fmt  = n => Number(n||0).toLocaleString('en');
  const fmtR = n => 'NT$' + Math.round(n||0).toLocaleString('en');
  const fmtS = s => { const v=parseFloat(s||0); const m=Math.floor(v/60); return `${m}:${String(Math.round(v%60)).padStart(2,'0')}`; };
  const fmtB = v => (parseFloat(v||0)*100).toFixed(1)+'%';

  const sinceD = since.replace(/-/g,'');
  const untilD = until.replace(/-/g,'');
  const prevSinceD = prev.since.replace(/-/g,'');
  const prevUntilD = prev.until.replace(/-/g,'');

  // Daily - filter by date range (ascending for chart, descending for table)
  const dailyAsc = (cache.daily||[])
    .filter(r => r.date >= sinceD && r.date <= untilD)
    .sort((a,b) => a.date.localeCompare(b.date));
  const dailyAscB = ga4BucketDaily(dailyAsc, ga4Grain);
  const daily = [...dailyAscB].reverse();

  // Channels: aggregate daily_channels filtered by date range
  const chMap = {};
  (cache.daily_channels||[])
    .filter(r => r.date >= sinceD && r.date <= untilD)
    .forEach(r => {
      const k = r.sessionDefaultChannelGrouping||'(other)';
      if (!chMap[k]) chMap[k] = {sessionDefaultChannelGrouping:k,sessions:0,addToCarts:0,conversions:0,totalRevenue:0,_dur:0,_bRate:0,_n:0};
      const m = chMap[k];
      m.sessions   += parseFloat(r.sessions||0);
      m.addToCarts += parseFloat(r.addToCarts||0);
      m.conversions+= parseFloat(r.conversions||0);
      m.totalRevenue+=parseFloat(r.totalRevenue||0);
      m._dur  += parseFloat(r.averageSessionDuration||0);
      m._bRate+= parseFloat(r.bounceRate||0);
      m._n++;
    });
  Object.values(chMap).forEach(m => {
    m.averageSessionDuration = m._n ? m._dur/m._n : 0;
    m.bounceRate = m._n ? m._bRate/m._n : 0;
  });
  const channels = Object.values(chMap).sort((a,b) => b.sessions - a.sessions);

  // Source/medium: aggregate daily_source_medium filtered by date range
  const smMap = {};
  (cache.daily_source_medium||[])
    .filter(r => r.date >= sinceD && r.date <= untilD)
    .forEach(r => {
      const k = r.sessionSourceMedium||'(other)';
      if (!smMap[k]) smMap[k] = {sessionSourceMedium:k,sessions:0,addToCarts:0,conversions:0,totalRevenue:0,_dur:0,_bRate:0,_n:0};
      const m = smMap[k];
      m.sessions   += parseFloat(r.sessions||0);
      m.addToCarts += parseFloat(r.addToCarts||0);
      m.conversions+= parseFloat(r.conversions||0);
      m.totalRevenue+=parseFloat(r.totalRevenue||0);

         ticks:{font:{size:10}, callback: isRev ? v=>'$'+Math.round(v/1000)+'K' : v=>v>=1000?(v/1000).toFixed(1)+'K':v} },

      const nBars = data.labels.length;
      ctx.save();
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let bi = 0; bi < nBars; bi++) {
        let total = 0;
        for (let di = 0; di < nDs; di++) total += data.datasets[di].data[bi] || 0;
        if (!total) continue;
        for (let di = 0; di < nDs; di++) {

        y2: { position:'right', beginAtZero:true, grid:{display:false},   ticks:{callback:v=>'NT$'+Math.round(v/1000)+'K',font:{size:10}} },
        y3: { display:false, beginAtZero:true },

      title:{display:true,text:title,font:{size:12},padding:{bottom:6}},

let sholineTrendChart = null;
let slGrain = 'day';
let _slArgs = null;
function setSlGrain(g) {
  slGrain = g;
  if (_slArgs) renderSholine.apply(null, _slArgs);
}
function slBucket(rows, grain) {
  if (grain === 'day') return rows;
  const pad = n => String(n).padStart(2,'0');
  const keyOf = d => {
    const t = new Date(d + 'T00:00:00');
    if (grain === 'month') return { k: d.slice(0,7), label: d.slice(0,7) };
    const mon = new Date(t);
    mon.setDate(t.getDate() - ((t.getDay() + 6) % 7));
    const sun = new Date(mon);
    sun.setDate(mon.getDate() + 6);
    const k = `${mon.getFullYear()}-${pad(mon.getMonth()+1)}-${pad(mon.getDate())}`;
    return { k, label: `${pad(mon.getMonth()+1)}/${pad(mon.getDate())}–${pad(sun.getMonth()+1)}/${pad(sun.getDate())}` };
  };
  const map = {};
  for (const r of rows) {
    const { k, label } = keyOf(r.date);
    if (!map[k]) map[k] = { date: label, _k: k, gmv:0, revenue:0, orders:0, returns:0, cancelled:0, sessions:0, adSpend:0, adRev:0 };
    const g = map[k];
    for (const f of ['gmv','revenue','orders','returns','cancelled','sessions','adSpend','adRev']) g[f] += r[f] || 0;
  }
  return Object.values(map).sort((a,b) => a._k > b._k ? 1 : -1).map(g => ({
    ...g, siteRoas: g.adSpend > 0 ? g.revenue/g.adSpend : 0,
  }));
}

      const potential = allItems
        .map(r => ({...r, cvr: r.views>0?r.purchased/r.views*100:0, atcRate: r.views>0?r.atc/r.views*100:0}))
        .filter(r => r.views >= medianViews && r.cvr < 2)
        .sort((a,b) => b.views - a.views)
        .slice(0, 15);
      if (!potential.length) return '';
      return `<div class="table-card" style="margin-top:14px">
        <div class="table-header"><h3>💡 有潛力品項</h3><span style="font-size:11px;color:#aaa">高瀏覽但轉換率 &lt; 2%，值得優化</span></div>
        ${collapseTable(potential, r => `<tr>
          <td>${r.name}</td>
          <td style="text-align:right">${r.views.toLocaleString()}</td>
          <td style="text-align:right">${r.atcRate.toFixed(1)}%</td>
          <td style="text-align:right;color:#f5222d;font-weight:600">${r.cvr.toFixed(2)}%</td>
          <td style="text-align:right;color:#aaa">${fmtM(r.revenue)}</td>
        </tr>`,
        `<tr><th>商品名稱</th><th style="text-align:right">瀏覽數</th><th style="text-align:right">加購率</th><th style="text-align:right">轉換率</th><th style="text-align:right">營收</th></tr>`,
        'sl-potential')}
      </div>`;
    })()}
    ${(() => {
      // ── 折扣碼使用 ──
      if (!slDiscCache || !Object.keys(slDiscCache).length) return '';
      const discMap = {};
      Object.entries(slDiscCache).filter(([d]) => d >= since && d <= until).forEach(([, rows]) => {
        rows.forEach(r => {
          if (!discMap[r.code]) discMap[r.code] = {code: r.code, title: r.title||r.code, count: 0, discount: 0, revenue: 0};
          discMap[r.code].count    += r.count;
          discMap[r.code].discount += r.discount;
          discMap[r.code].revenue  += r.revenue||0;
          if (r.title) discMap[r.code].title = r.title;
        });
      });
      const discRows = Object.values(discMap).sort((a,b) => b.count - a.count);
      if (!discRows.length) return '<div class="table-card" style="margin-top:14px"><div class="table-header"><h3>🎟️ 折扣碼使用</h3></div><div style="padding:16px;color:#aaa;font-size:13px">此區間無折扣碼使用紀錄</div></div>';
      const totalDisc = discRows.reduce((s,r)=>s+r.discount,0);
      return `<div class="table-card" style="margin-top:14px">
        <div class="table-header"><h3>🎟️ 折扣碼使用</h3><span style="font-size:11px;color:#aaa">總折扣 ${fmtM(totalDisc)}</span></div>
        ${collapseTable(discRows, r => `<tr>
          <td>${r.title}</td>
          <td style="font-family:monospace;font-size:11px;color:#aaa">${r.code}</td>
          <td style="text-align:right">${r.count.toLocaleString()} 次</td>
          <td style="text-align:right;color:#f5222d">${fmtM(r.discount)}</td>
          <td style="text-align:right;color:#10b981">${fmtM(r.revenue)}</td>
          <td style="text-align:right;color:#aaa">${totalDisc>0?(r.discount/totalDisc*100).toFixed(1)+'%':'—'}</td>
        </tr>`,
        `<tr><th>優惠名稱</th><th>折扣碼</th><th style="text-align:right">使用次數</th><th style="text-align:right">折扣金額</th><th style="text-align:right">總成交額</th><th style="text-align:right">佔比</th></tr>`,
        'sl-discounts')}
      </div>`;
    })()}
`;

  if (sholineTrendChart) sholineTrendChart.destroy();
  sholineTrendChart = new Chart(document.getElementById('sholineTrendChart'), {
    data: { labels: bucketed.map(r=>r.date), datasets: [
      { type:'bar',  label:'成交額',   data: bucketed.map(r=>r.revenue), backgroundColor:'rgba(100,210,230,0.6)', borderColor:'#38bcd8', borderWidth:1, borderRadius:3, yAxisID:'y', order:2 },
      { type:'bar',  label:'廣告營收', data: bucketed.map(r=>r.adRev),   backgroundColor:'rgba(110,130,220,0.55)', borderColor:'#6b7fd6', borderWidth:1, borderRadius:3, yAxisID:'y', order:3 },
      { type:'line', label:'全站ROAS', data: bucketed.map(r=>r.siteRoas), borderColor:'#e8833a', backgroundColor:'transparent', borderWidth:2.5, pointRadius:3, tension:0.3, yAxisID:'y2', order:1 },
    ]},
    options: { responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      plugins:{ legend:{position:'top',labels:{font:{size:11},boxWidth:12,padding:12}} },
      scales: {
        x:  { grid:{display:false}, ticks:{font:{size:10},maxTicksLimit:14} },
        y:  { position:'left',  beginAtZero:true, grid:{color:'#f0f2f5'}, ticks:{callback:v=>'NT$'+Math.round(v/1000)+'K',font:{size:10}} },
        y2: { position:'right', beginAtZero:true, grid:{display:false}, ticks:{callback:v=>v.toFixed(1)+'x',font:{size:10}} },
      }
    }
  });
}

fetchData();
</script>
</body>
</html>
