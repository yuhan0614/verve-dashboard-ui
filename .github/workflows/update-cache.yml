name: Update cache

on:
  schedule:
    - cron: '0 * * * *'    # 每小時整點
  workflow_dispatch:        # 手動觸發

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests google-analytics-data google-auth

      - name: Write GA4 service account
        run: echo "${{ secrets.GA4_SA_JSON }}" | base64 --decode > ga4_sa.json

      - name: Update caches
        env:
          SHOPLINE_TOKEN: ${{ secrets.SHOPLINE_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python update_cache.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sl_cache.json sl_items_cache.json sl_discounts_cache.json ga4_cache.json meta_cache.json ga4_daily.json ga4_channels.json ga4_source_medium.json ga4_items.json ga4_search.json ga4_meta.json
          git diff --cached --quiet || git commit -m "chore: auto-update cache $(date -u +%Y-%m-%d)"
          git push
