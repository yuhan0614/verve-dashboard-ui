name: Update cache

on:
  schedule:
    - cron: '0 * * * *'    # 每小時整點
  workflow_dispatch:        # 手動觸發

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests google-analytics-data google-auth

      - name: Update caches
        env:
          SHOPLINE_TOKEN: ${{ secrets.SHOPLINE_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GA4_CLIENT_ID: ${{ secrets.GA4_CLIENT_ID }}
          GA4_CLIENT_SECRET: ${{ secrets.GA4_CLIENT_SECRET }}
          GA4_REFRESH_TOKEN: ${{ secrets.GA4_REFRESH_TOKEN }}
        run: python update_cache.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sl_cache.json sl_items_cache.json sl_discounts_cache.json ga4_cache.json meta_cache.json ga4_meta.json gads_cache.json
          git add ga4_daily.json ga4_channels.json ga4_source_medium.json ga4_items.json ga4_search.json
          git add ga4_*_recent.json
          if git diff --cached --quiet; then
            echo "沒有變更，不需提交"
            exit 0
          fi
          git commit -m "chore: auto-update cache $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then echo "推送成功"; exit 0; fi
            echo "推送被拒（第 $i 次），改用 rebase 後重試…"
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "重試 5 次仍失敗"; exit 1

      - name: 檢查資料來源是否都正常
        if: always()
        run: |
          if [ ! -f cache_status.json ]; then
            echo "::error::update_cache.py 沒跑完，沒有產生 cache_status.json"
            exit 1
          fi
          python - <<'EOF'
          import json, sys
          s = json.load(open("cache_status.json"))
          if s["ok"]:
              print("✅ 所有資料來源都正常")
              sys.exit(0)
          for f in s["failures"]:
              print(f"::error::資料來源異常 — {f}")
          sys.exit(1)
          EOF
